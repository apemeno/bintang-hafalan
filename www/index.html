*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ar{font-family:var(--f-ar);direction:rtl;line-height:2.2;font-size:1.85rem}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 1.25rem);padding-bottom:1.5rem;position:relative;overflow:hidden;color:#fff}
.hero .wrap{position:relative;display:flex;flex-direction:column;gap:.75rem}
.hero h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(2rem,7vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance;text-shadow:0 2px 0 rgba(20,20,80,.18)}
.hero p{margin:0;max-width:34ch;font-weight:600;opacity:.95}
.moon{position:absolute;right:-30px;top:-20px;width:170px;height:170px;opacity:.95;pointer-events:none}
.scorebar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.25rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;background:rgba(16,20,70,.28);border-radius:999px;padding:.35rem .85rem;font-weight:800;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.pill b{color:var(--sun)}

main{padding-block:1.25rem 3rem}
.sec-title{font-family:var(--f-disp);font-size:1.3rem;font-weight:800;margin:.25rem 0 .75rem}
.hint{color:var(--muted);font-size:.95rem;margin:-.5rem 0 1rem}

/* surah list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.75rem}
.scard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.7rem .85rem;text-align:left;transition:transform .12s ease,border-color .12s}
.scard:hover{transform:translateY(-2px);border-color:var(--accent)}
.num{width:42px;height:42px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;background:var(--sky2);border-radius:12px;font-variant-numeric:tabular-nums}
.scard.done .num{background:var(--sun);color:var(--sun-ink)}
.sname{font-family:var(--f-disp);font-weight:800;font-size:1.08rem;line-height:1.15}
.smeta{color:var(--muted);font-size:.82rem;line-height:1.3}
.sar{font-family:var(--f-ar);font-size:1.35rem;direction:rtl;line-height:1.6}
.stars{color:var(--sun);font-size:.85rem;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}

/* top bar inside screens */
.topbar{display:flex;align-items:center;gap:.75rem;padding-block:1rem .5rem}
.back{border:none;background:var(--card);width:44px;height:44px;border-radius:14px;font-size:1.3rem;font-weight:800;border:2px solid var(--line);flex:none}
.topbar h2{font-family:var(--f-disp);font-size:1.35rem;margin:0;line-height:1.1}
.topbar .sub{color:var(--muted);font-size:.9rem}

.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:1.1rem}
.surah-head{text-align:center;display:flex;flex-direction:column;gap:.15rem;margin-bottom:1rem}
.surah-head .ar{font-size:2.4rem;line-height:1.6}

.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;border:none;border-radius:20px;padding:1rem;min-height:128px;color:var(--ink);background:var(--sky2);position:relative}
.act .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card)}
.act .ico svg{width:26px;height:26px}
.act h3{margin:0;font-family:var(--f-disp);font-size:1.15rem;line-height:1.1}
.act p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.35}
.act .stars{position:absolute;top:1rem;right:1rem;font-size:1rem}
.act:hover{outline:3px solid var(--accent);outline-offset:-3px}
.listen{display:inline-flex;gap:.4rem;align-items:center;margin-top:1rem;color:var(--accent);font-weight:800;text-decoration:none}

/* read mode */
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.45rem .95rem;font-weight:800;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ayat{display:flex;flex-direction:column;gap:.75rem}
.ay{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.ay .ar{text-align:right;font-size:1.9rem}
.ay .tr{color:var(--muted);font-size:.95rem}
.ay .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.ay.hidden-ar .ar .rest{filter:blur(9px);opacity:.55;transition:filter .2s}
.ay.peek .ar .rest{filter:none;opacity:1}
.mark{font-family:var(--f-ar);color:var(--accent)}
.tick{border:2px solid var(--line);background:transparent;border-radius:999px;padding:.25rem .75rem;font-weight:800;font-size:.85rem;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}

/* game */
.progress{height:14px;background:var(--sky2);border-radius:999px;overflow:hidden;margin:.25rem 0 1rem}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#FF9F43);border-radius:999px;transition:width .35s ease}
.prompt{font-family:var(--f-disp);font-weight:700;font-size:1.1rem;margin:0 0 .75rem}
.question .ar{text-align:center;font-size:2rem}
.question .tr{color:var(--muted);text-align:center;font-size:.95rem;margin-top:.25rem}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px dashed var(--accent);color:transparent;margin:0 .15em;line-height:1.2}
.blank.filled{color:var(--good);border-bottom-color:var(--good)}
.opts{display:grid;gap:.6rem;margin-top:1rem}
.opts.words{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:.5rem .9rem;font-family:var(--f-ar);font-size:1.6rem;line-height:1.9;direction:rtl;text-align:center;transition:transform .1s}
.opts.lines .opt{text-align:right;font-size:1.5rem}
.opt:active{transform:scale(.97)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.built{display:flex;flex-direction:column;gap:.5rem;min-height:3rem;margin-bottom:1rem}
.built .line{background:var(--good-bg);border:2px solid var(--good);border-radius:14px;padding:.25rem .8rem;display:flex;gap:.6rem;align-items:center;direction:rtl;animation:pop .25s ease}
.built .line .ar{font-size:1.45rem;flex:1;text-align:right}
.built .slot{border:2px dashed var(--line);border-radius:14px;padding:.6rem .8rem;color:var(--muted);text-align:center;font-weight:700}
.badge{font-family:var(--f-disp);font-weight:800;background:var(--good);color:var(--card);min-width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.95rem;flex:none}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
.feedback{min-height:1.6rem;font-weight:800;text-align:center;margin-top:.75rem}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.prev{opacity:.55;font-size:1.5rem !important}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.75rem;padding-block:1.5rem}
.bigstars{display:flex;gap:.4rem}
.bigstars svg{width:68px;height:68px}
.bigstars .s{animation:starin .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars .s:nth-child(2){animation-delay:.15s}.bigstars .s:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result h2{font-family:var(--f-disp);font-size:2rem;margin:0;line-height:1.1}
.result p{margin:0;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.5rem}
.btn{border:none;border-radius:16px;padding:.8rem 1.3rem;font-weight:800;font-size:1rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.foot{color:var(--muted);font-size:.8rem;margin-top:2rem;line-height:1.5}
.foot a{color:inherit}
.w1{color:var(--w1)}.w2{color:var(--w2)}.w3{color:var(--w3)}.w4{color:var(--w4)}.w5{color:var(--w5)}
body.nocolor .w{color:inherit}
.tj{cursor:pointer;border-radius:4px}
.tj:hover{background:var(--sky2)}
.tj-grey{color:var(--tj-grey)}.tj-mad2{color:var(--tj-mad2)}.tj-madj{color:var(--tj-madj)}.tj-madw{color:var(--tj-madw)}.tj-madl{color:var(--tj-madl)}
.tj-qal{color:var(--tj-qal)}.tj-ghun{color:var(--tj-ghun)}.tj-ikh{color:var(--tj-ikh)}.tj-iqlab{color:var(--tj-iqlab)}.tj-idg{color:var(--tj-idg)}
.legend{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.6rem 1rem;margin-bottom:1rem}
.legend summary{font-family:var(--f-disp);font-weight:800;font-size:1.05rem;cursor:pointer}
.legend ul{list-style:none;margin:.5rem 0 .25rem;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.45rem .9rem}
.legend li{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;line-height:1.3}
.legend .dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:.15rem;background:currentColor}
.legend b{display:block}
.legend .lt{color:var(--ink)}
.legend .ld{color:var(--muted);font-size:.82rem}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;padding:.4rem .8rem;font-weight:800;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.missions{margin-bottom:1.5rem;display:flex;flex-direction:column;gap:.6rem}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.mhead .sec-title{margin:0}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:center;border:2px solid var(--line);background:var(--sky);border-radius:16px;padding:.6rem .8rem;text-align:left}
.mrow .chk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;background:var(--card);border:2px solid var(--line)}
.mrow .mtxt{font-weight:800;line-height:1.25}
.mrow .bar{display:block;height:8px;border-radius:99px;background:var(--sky2);margin-top:.35rem;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.mrow .mp{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow.done{border-color:var(--good);background:var(--good-bg)}
.mrow.done .chk{background:var(--good);border-color:var(--good);color:var(--card)}
.mrow.done .bar i{background:var(--good)}
.mdone{margin:0;text-align:center;font-weight:800;color:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:.7rem 1.1rem;border-radius:16px;font-weight:800;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.newm{background:var(--good-bg);color:var(--good);border-radius:14px;padding:.5rem .9rem;font-weight:800}
.path{display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding-bottom:2rem}
.unit{width:100%;border-radius:20px;padding:1rem 1.1rem;color:#fff;background:var(--uc);box-shadow:0 5px 0 var(--ucd);display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:1rem}
.unit h3{margin:0;font-family:var(--f-disp);font-size:1.35rem;line-height:1.1}
.unit p{margin:.15rem 0 0;font-weight:700;opacity:.95;font-size:.92rem;line-height:1.3}
.unit .uprog{font-family:var(--f-disp);font-weight:800;background:rgba(0,0,0,.18);border-radius:12px;padding:.3rem .65rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.u1{--uc:var(--u1);--ucd:var(--u1d)}.u2{--uc:var(--u2);--ucd:var(--u2d)}.u3{--uc:var(--u3);--ucd:var(--u3d)}.u4{--uc:var(--u4);--ucd:var(--u4d)}

atan"],["يُسۡقَوۡنَ مِن رَّحِيقٖ مَّخۡتُومٍ","Mereka diberi minum dari khamar murni (tidak memabukkan) yang (tempatnya) masih dilak (disegel)"],["خِتَٰمُهُۥ مِسۡكٞۚ وَفِي ذَٰلِكَ فَلۡيَتَنَافَسِ ٱلۡمُتَنَٰفِسُونَ","laknya dari kasturi. Dan untuk yang demikian itu hendaknya orang berlomba-lomba"],["وَمِزَاجُهُۥ مِن تَسۡنِيمٍ","Dan campurannya dari tasnīm"],["عَيۡنٗا يَشۡرَبُ بِهَا ٱلۡمُقَرَّبُونَ","(yaitu) mata air yang diminum oleh mereka yang dekat (kepada Allah)"],["إِنَّ ٱلَّذِينَ أَجۡرَمُواْ كَانُواْ مِنَ ٱلَّذِينَ ءَامَنُواْ يَضۡحَكُونَ","Sesungguhnya orang-orang yang berdosa, adalah mereka yang dahulu menertawakan orang-orang yang beriman"],["وَإِذَا مَرُّواْ بِهِمۡ يَتَغَامَزُونَ","Dan apabila mereka (orang-orang yang beriman) melintas di hadapan mereka, mereka saling mengedip-ngedipkan matanya"],["وَإِذَا ٱنقَلَبُوٓاْ إِلَىٰٓ أَهۡلِهِمُ ٱنقَلَبُواْ فَكِهِينَ","dan apabila kembali kepada kaumnya, mereka kembali dengan gembira ria"],["وَإِذَا رَأَوۡهُمۡ قَالُوٓاْ إِنَّ هَـٰٓؤُلَآءِ لَضَآلُّونَ","Dan apabila mereka melihat (orang-orang mukmin), mereka mengatakan, \"Sesungguhnya mereka benar-benar orang-orang sesat"],["وَمَآ أُرۡسِلُواْ عَلَيۡهِمۡ حَٰفِظِينَ","padahal (orang-orang yang berdosa itu), mereka tidak diutus sebagai penjaga (orang-orang mukmin)"],["فَٱلۡيَوۡمَ ٱلَّذِينَ ءَامَنُواْ مِنَ ٱلۡكُفَّارِ يَضۡحَكُونَ","Maka pada hari ini, orang-orang yang beriman yang menertawakan orang-orang kafir"],["عَلَى ٱلۡأَرَآئِكِ يَنظُرُونَ","mereka (duduk) di atas dipan-dipan melepas pandangan"],["هَلۡ ثُوِّبَ ٱلۡكُفَّارُ مَا كَانُواْ يَفۡعَلُونَ","Apakah orang-orang kafir itu diberi balasan (hukuman) terhadap apa yang telah mereka perbuat"]],"tj":[[["وَيْ",""],["لٌ","idgham_wo_ghunnah"],[" لِّلْمُطَفِّف",""],["ِي","madda_permissible"],["نَ",""]],[["ٱلَّذِينَ إِذَا ",""],["ٱ","ham_wasl"],["كْتَالُو",""],["اْ","slnt"],[" عَلَى ",""],["ٱ","ham_wasl"],["ل","laam_shamsiyah"],["نّ","ghunnah"],["َاسِ يَسْتَوْف",""],["ُو","madda_permissible"],["نَ",""]],[["وَإِذَا كَالُ "lat":"An-Nazi'at","v":[["وَٱلنَّـٰزِعَٰتِ غَرۡقٗا","Demi (malaikat) yang mencabut (nyawa) dengan keras"],["وَٱلنَّـٰشِطَٰتِ نَشۡطٗا","Demi (malaikat) yang mencabut (nyawa) dengan lemah lembut"],["وَٱلسَّـٰبِحَٰتِ سَبۡحٗا","Demi (malaikat) yang turun dari langit dengan cepat"],["فَٱلسَّـٰبِقَٰتِ سَبۡقٗا","dan (malaikat) yang mendahului dengan kencang"],["فَٱلۡمُدَبِّرَٰتِ أَمۡرٗا","dan (malaikat) yang mengatur urusan (dunia)"],["يَوۡمَ تَرۡجُفُ ٱلرَّاجِفَةُ","(Sungguh, kamu akan dibangkitkan) pada hari ketika tiupan pertama mengguncangkan alam"],["تَتۡبَعُهَا ٱلرَّادِفَةُ","(tiupan pertama) itu diiringi oleh tiupan kedua"],["قُلُوبٞ يَوۡمَئِذٖ وَاجِفَةٌ","Hati manusia pada waktu itu merasa sangat takut"],["أَبۡصَٰرُهَا خَٰشِعَةٞ","pandangannya tunduk"],["يَقُولُونَ أَءِنَّا لَمَرۡدُودُونَ فِي ٱلۡحَافِرَةِ","(orang-orang kafir) berkata, \"Apakah kita benar-benar akan dikembalikan kepada kehidupan yang semula"],["أَءِذَا كُنَّا عِظَٰمٗا نَّخِرَةٗ","Apakah (akan dibangkitkan juga) apabila kita telah menjadi tulang belulang yang hancur"],["قَالُواْ تِلۡكَ إِذٗا كَرَّةٌ خَاسِرَةٞ","Mereka berkata, \"Kalau demikian, itu adalah suatu pengembalian yang merugikan"],["فَإِنَّمَا هِيَ زَجۡرَةٞ وَٰحِدَةٞ","Maka pengembalian itu hanyalah dengan sekali tiupan saja"],["فَإِذَا هُم بِٱلسَّاهِرَةِ","Maka seketika itu mereka hidup kembali di bumi (yang baru)"],["هَلۡ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ","Sudahkah sampai kepadamu (Muhammad) kisah Musa"],["إِذۡ نَادَىٰهُ رَبُّهُۥ بِٱلۡوَادِ ٱلۡمُقَدَّسِ طُوًى","Ketika Tuhan memanggilnya (Musa) di lembah suci yaitu Lembah Tuwa"],["ٱذۡهَبۡ إِلَىٰ فِرۡعَوۡنَ إِنَّهُۥ طَغَىٰ","pergilah engkau kepada Fir'aun! Sesungguhnya dia telah melampaui batas"],["فَقُلۡ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ","Maka katakanlah (kepada Fir'aun), \"Adakah keinginanmu untuk membersihkan diri (dari kesesatan)"],["وَأَهۡدِيَكَ إِلَىٰ رَبِّكَ فَتَخۡشَىٰ","dan engkau akan kubimbing ke jalan Tuhanmu agar engkau takut kepada-Nya"],["فَأَرَىٰهُ ٱلۡأٓيَةَ ٱلۡكُبۡرَىٰ","Lalu (Musa) const DAY=864e5;

  const k=todayKey(); let D=P._day;

    const S=P._streak, y=todayKey(new Date(Date.now()-DAY)), y2=todayKey(new Date(Date.now()-2*DAY));
    if(S && S.last===y2 && S.count>0 && P._inv && P._inv.freeze>0){ P._inv.freeze--; S.last=y; P._frozeNote=1; }
    const rnd=seeded(k);
    const LST=ORDER.length?ORDER:J30_IDS; const target=LST.find(n=>starsOf(n)<9)||LST[Math.floor(rnd()*LST.length)];
    const kind=['susun','lengkapi','lanjut'][Math.floor(rnd()*3)];
    const pool=[{t:'stars',goal:5+Math.floor(rnd()*2)},{t:'hafal',goal:2+Math.floor(rnd()*2)},{t:'perfect',goal:1},{t:'games',goal:3},{t:'tajwid',goal:3}];
    const a=pool.splice(Math.floor(rnd()*pool.length),1)[0], b=pool.splice(Math.floor(rnd()*pool.length),1)[0];
    D=P._day={date:k,stars:0,games:0,perfect:0,hafal:0,played:[],hk:[],m:[{t:'play',n:target,kind,goal:1,name:BYN[target].lat,j:ORDER.length?curJuz:30},a,b],complete:false};
    save();
  }
  return D;
}
function mprog(m,D){ return m.t==='play' ? (D.played.includes(m.n+':'+m.kind)?1:0) : Math.min(m.goal,D[m.t]||0); }
function mtext(m){
  switch(m.t){
    case 'play': return `Main ${GAMES[m.kind].name} ${m.name||(BYN[m.n]&&BYN[m.n].lat)||''}`;
    case 'stars': return `Kumpulkan ${m.goal} bintang`;
    case 'hafal': return `Tandai ${m.goal} ayat sudah hafal`;
    case 'perfect': return 'Dapat 3 bintang tanpa salah';

}
function bump(inc,playedKey){
  const D=day(); const before=D.m.map(m=>mprog(m,D)>=m.goal);
  Object.keys(inc).forEach(k=>D[k]=(D[k]||0)+inc[k]);
  if(playedKey && !D.played.includes(playedKey)) D.played.push(playedKey);
  const after=D.m.map(m=>mprog(m,D)>=m.goal);
  const newly=D.m.filter((m,i)=>after[i]&&!before[i]);
  let finished=false;
  if(!D.complete && after.every(Boolean)){
    D.complete=true; finished=true;
    const S=P._streak||{last:null,count:0}; const y=todayKey(new Date(Date.now()-DAY));
    S.count = S.last===y ? S.count+1 : 1; S.last=D.date; P._streak=S;
    P._best=Math.max(P._best||0,S.count);
  }
  P._coins=(P._coins||0)+newly.length*10+(finished?20:0);
  save(); return {newly,finished};
}

const fx=document.getElementById('fx'), cx=fx.getContext('2d'); let parts=[], raf=0;
function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio;
  const cols=['#FFC83D','#FF8FAB','#7FC4FF','#6EE7B7','#B9A8FF'];
  for(let i=0;i<90;i++) parts.push({x:fx.width/2,y:fx.height*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*14-4)*devicePixelRatio,r:(6+Math.random()*8)*devicePixelRatio,c:pick(cols),a:Math.random()*6,life:120});
  if(!raf) loop();
}
function starPath(x,y,r,a){cx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,t=a+i*Math.PI/5;cx.lineTo(x+Math.cos(t)*rr,y+Math.sin(t)*rr);}cx.closePath();}

  cx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45*devicePixelRatio;p.a+=.1;p.life--;cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.life/120);starPath(p.x,p.y,p.r,p.a);cx.fill();});
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+50);
  raf = parts.length? requestAnimationFrame(loop) : (cx.clearRect(0,0,fx.width,fx.height),0);
}

async function charPNG(c){

  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

  const g=cv.getContext('2d');
  g.fillStyle='#FFFDF5'; g.fillRect(0,0,600,820);
  g.drawImage(img,0,10,600,700);
  g.fillStyle='#1B2547'; g.textAlign='center';

  g.fillStyle='#5A6690'; g.font='700 26px Nunito, system-ui, sans-serif'; g.fillText('Bintang Hafalan',300,800);

}

}

  return `<main class="wrap tabpage">
    <h2 class="pagetitle">Toko</h2>
    <div class="panel coinbank">${STAR_IC.replace('class="ic"','class="bigcoin"')}<div><div class="sk">${totalStars()} bintang</div><div class="smeta">Kumpulkan bintang dari permainan untuk membuka teman karakter baru. Karakter bisa dipakai dan diunduh gambarnya.</div></div></div>
    <div class="mhead"><h2 class="sec-title" style="margin:0">Karakter Teman Hafalan</h2><span class="smeta">${CHARS.filter(charOpen).length}/${CHARS.length}</span></div>

  </main>`;
}
function buy(id){
  const it=SHOP.find(x=>x.id===id), I=inv();
  if(coins()<it.price){ sBad(); toast('Koinnya belum cukup. Ayo kumpulkan dari permainan dan misi!'); return; }
  if(id==='freeze'){ if(I.freeze>=2) return; I.freeze++; }
  if(id==='hint') I.hint+=3;
  if(id==='gold'){ if(I.gold) return; I.gold=true; }
  P._coins=coins()-it.price; save(); sWin(); toast(it.name+' sudah jadi milikmu!'); home(true);
}

function home(keep){
  const sy=window.scrollY;
  const tab=state.tab||'learn';
  const body = tab==='misi'?misiHTML(): tab==='profil'?profilHTML(): tab==='toko'?tokoHTML(): tab==='atur'?aturHTML(): learnHTML();
  $app.innerHTML = statusBar() + body + tabBar(tab);
  document.body.classList.add('has-tabs');
  $app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ const t=b.dataset.tab; if(t===tab && t==='learn'){ const c=document.getElementById('curnode'); if(c) c.scrollIntoView({block:'center',behavior:'smooth'}); return; } go({screen:'home',tab:t,focus:t==='learn'}); });
  $app.querySelectorAll('[data-surah]').forEach(b=>b.onclick=()=>go({screen:'surah',n:b.dataset.surah}));
  $app.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>openNode(+b.dataset.node));
  $app.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  $app.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>wearChar(b.dataset.wear));
  $app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>dlChar(b.dataset.dl));
  checkNewChars();
  $app.querySelectorAll('[data-juz]').forEach(b=>b.onclick=()=>{ const j=+b.dataset.juz; switchJuz(j, ()=>{ toast('Juz '+j+' dipilih'); go({screen:'home',tab:'learn',focus:true}); }); });
  on0('juzchip',()=>go({screen:'home',tab:'atur'}));
  function on0(id,f){ const el=document.getElementById(id); if(el) el.onclick=f; }
  const nf=document.getElementById('nameForm');
  if(nf) nf.addEventListener('submit',e=>{e.preventDefault(); const v=document.getElementById('nameInput').value; if(!v.trim()){toast('Tulis namamu dulu ya');return;} setName(v); state.editName=false; sGood(); home(true); toast("Assalamu'alaikum, "+kidName+'!');});
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=f; };
  on('editName',()=>{state.editName=true;home(true);const i=document.getElementById('nameInput');if(i){i.focus();i.select();}});
  on('layout',()=>{const k=Object.keys(LAYOUTS);setLayout(k[(k.indexOf(layMode)+1)%k.length]);home(true);toast('Tampilan: '+LAYOUTS[layMode]+(layMode==='auto'?' (mengikuti lebar layar)':''));});
  on('cstart',()=>{const c=document.getElementById('curnode'); if(c) c.scrollIntoView({block:'center',behavior:'smooth'});});
  on('free',()=>{freeMode=!freeMode;try{localStorage.setItem('bh-free',freeMode?'1':'0')}catch(e){};home(true);toast(freeMode?'Semua langkah terbuka (mode orang tua)':'Langkah dibuka berurutan');});
  on('mute',()=>{muted=!muted;try{localStorage.setItem('bh-mute',muted?'1':'0')}catch(e){};home(true);});
  on('color',()=>{const k=Object.keys(MODES);setMode(k[(k.indexOf(cmode)+1)%k.length]);home(true);});
  if(!document.getElementById('jump')){ const j=document.createElement('button'); j.id='jump'; j.className='jump'; j.setAttribute('aria-label','Ke langkah sekarang'); j.textContent='↓'; j.onclick=()=>{const c=document.getElementById('curnode'); if(c) c.scrollIntoView({block:'center',behavior:'smooth'});}; document.body.appendChild(j); }
  document.getElementById('jump').hidden = tab!=='learn';
  if(keep) window.scrollTo(0,sy);
  $app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const D=day(), m=D.m[+b.dataset.m], tgt=D.m[0].n;
    if(!BYN[tgt]){ switchJuz(D.m[0].j||30, ()=>b.click()); return; }
    if(m.t==='play') startGame(m.n,m.kind); else if(m.t==='tajwid'){ setMode('tajwid'); go({screen:'baca',n:tgt}); } else if(m.t==='hafal') go({screen:'baca',n:tgt}); else go({screen:'surah',n:tgt});
  });
  if(P._frozeNote){ toast('Penjaga Hari Beruntun dipakai. Hari beruntunmu aman!'); delete P._frozeNote; save(); }
}

  $app.innerHTML = top(esc(s.lat), `Surah ke-${s.sn} · ${s.off?'ayat '+(s.off+1)+'–'+(s.off+s.v.length):s.v.length+' ayat'}`, 'home') + `
  <main class="wrap" style="padding-top:.25rem">
    <div class="panel">
      <div class="surah-head"><div class="ar" lang="ar">${s.ar}</div><div style="font-weight:800">${esc(s.lat)}</div><div class="smeta">${esc(s.id)}</div></div>
      <div class="acts">
        ${act('baca','Baca & Hafal',`Baca per ayat, lalu tutup dan ingat. ${hafal}/${s.v.length} ayat ditandai hafal.`,null)}
        ${act('susun',GAMES.susun.name,GAMES.susun.desc,r.s.susun||0)}
        ${act('lengkapi',GAMES.lengkapi.name,GAMES.lengkapi.desc,r.s.lengkapi||0)}
        ${act('lanjut',GAMES.lanjut.name,GAMES.lanjut.desc,r.s.lanjut||0)}
      </div>
      <a class="listen" href="https://quran.com/${s.sn}${s.n.includes(':')?'/'+(s.off+1)+'-'+(s.off+s.v.length):''}" target="_blank" rel="noopener">Dengarkan bacaannya di Quran.com ↗</a>
      ${audioBtn(s.sn,s.off+1,'Putar Syekh Sudais dari ayat '+(s.off+1),s.off+s.v.length)}
    </div>
  </main>`;
  bindBack();
  $app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.act; if(k==='baca') go({screen:'baca',n}); else startGame(n,k);
  });
}

function baca(n){
  const s=BYN[n], r=rec(n); r.h=r.h||[];
  let hide = state.hide||false, showTr = state.tr!==false;
  const items = s.v.map(([ar,tr],i)=>{
    const words=ar.split(' '); let first=wspan(words[0],0), rest=words.length>1?cw(words.slice(1).join(' '),1):'';
    if(cmode==='tajwid'){ const x=tjAyat(n,i,true); first=x.first; rest=x.rest; }
    const h=r.h.includes(i+1);
    return `<div class="ay ${hide?'hidden-ar':''}" data-i="${i}">
      <div class="ar" lang="ar">${first} <span class="rest">${rest}</span> <span class="mark">﴿${arNum(s.off+i+1)}﴾</span></div>
      ${showTr?`<div class="tr">${s.off+i+1}. ${esc(tr)}</div>`:''}
      <div class="row"><span class="smeta">${hide?'Ketuk ayat untuk mengintip':''}</span><button class="tick" data-tick="${i+1}" aria-pressed="${h}">${h?'✓ Sudah hafal':'Tandai hafal'}</button></div>
    </div>`;}).join('');
  $app.innerHTML = top('Baca & Hafal', esc(s.lat), 'surah') + `
  <main class="wrap" style="padding-top:.25rem">
    <div class="toolbar">
      <button class="chip" id="tHide" aria-pressed="${hide}">Mode tutup ayat</button>
      <button class="chip" id="tTr" aria-pressed="${showTr}">Tampilkan arti</button>
      <span class="seg" role="group" aria-label="Warna">${Object.keys(MODES).map(k=>`<button data-mode="${k}" aria-pressed="${cmode===k}">${MODES[k]}</button>`).join('')}</span>
    </div>
    ${cmode==='tajwid'?legendHTML(n):''}
    <div class="ayat">${items}</div>
    <div class="btns" style="margin-top:1.25rem"><button class="btn next" id="doneRead">Selesai membaca ✓</button></div>
  </main>`;
  bindBack(n);
  document.getElementById('doneRead').onclick=()=>{
    const first=!r.b; r.b=true; save(); if(first){ sWin(); burst(); toast('Bagus! Langkah Baca & Hafal selesai'); }
    setTimeout(()=>go({screen:'home',focus:true}), first?700:0);
  };
  document.getElementById('tHide').onclick=()=>{state.hide=!hide;baca(n);};
  document.getElementById('tTr').onclick=()=>{state.tr=!showTr;baca(n);};
  $app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);baca(n);});
  const lg=document.getElementById('legend'); if(lg) lg.addEventListener('toggle',()=>state.legend=lg.open);
  $app.querySelectorAll('.ay').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('.tick')) return;
    if(hide){ el.classList.toggle('peek'); if(!el.classList.contains('peek')) return; }
    const tj=e.target.closest('.tj'); if(!tj) return;
    const R=RULES[tj.dataset.r]; toast(R[1]+': '+R[2]);
    const D=day(), key=n+':'+tj.dataset.r; D.tk=D.tk||[];
    if(!D.tk.includes(key)){ D.tk.push(key); P._tjTotal=(P._tjTotal||0)+1; const res=bump({tajwid:1}); if(res.newly.length||res.finished) setTimeout(()=>announce(res),2700); }
  }));
  $app.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.tick; const i=r.h.indexOf(k); if(i>=0) r.h.splice(i,1); else { r.h.push(k); sGood();
      const D=day(), key=n+':'+k; if(!D.hk.includes(key)){ D.hk.push(key); const res=bump({hafal:1}); announce(res); } } save();
    const on=r.h.includes(k); b.setAttribute('aria-pressed',on); b.textContent=on?'✓ Sudah hafal':'Tandai hafal';
  });
}

function bindBack(n){
  $app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.go; if(t==='home' || state.node!==undefined) go({screen:'home',focus:true}); else go({screen:'surah',n:n||state.n});
  });
}

// ---------- games ----------
function neighbourWords(n){ // kata dari surah ini dulu, lalu tetangga bila kurang
  const idx=ORDER.indexOf(n); const list=[n]; for(let d=1;d<6;d++){ if(ORDER[idx+d]) list.push(ORDER[idx+d]); if(ORDER[idx-d]) list.push(ORDER[idx-d]); }
  return list;
}
function buildLengkapi(n){
  const s=BYN[n]; const qs=[]; const used=new Set();
  const cand=[]; s.v.forEach(([ar,tr],i)=>{ const w=ar.split(' '); if(w.length>=2) w.forEach((x,j)=>cand.push({i,j})); });
  const pool=shuffle(cand); const want=Math.min(5,cand.length);
  for(const c of pool){
    if(qs.length>=want) break;
    const key=c.i+':'+c.j; if(used.has(key)) continue;
    if(qs.some(q=>q.i===c.i) && s.v.length>=want) continue; // beda ayat bila bisa
    used.add(key);
    const words=s.v[c.i][0].split(' '); const ans=words[c.j];
    const opts=new Set([ans]);
    for(const m of neighbourWords(n)){ for(const w of shuffle(BYN[m].v.flatMap(v=>v[0].split(' ')))){ if(opts.size>=4) break; if(w!==ans && w.length>1) opts.add(w); } if(opts.size>=4) break; }
    qs.push({type:'lengkapi',i:c.i,j:c.j,words,ans,opts:shuffle([...opts])});
  }
  qs.sort((a,b)=>a.i-b.i);
  return qs;
}
function buildLanjut(n){
  const s=BYN[n]; const L=s.v.length; const ks=shuffle(Array.from({length:L-1},(_,i)=>i)).slice(0,Math.min(5,L-1)).sort((a,b)=>a-b);
  return ks.map(k=>{
    const ans=s.v[k+1][0]; const opts=new Set([ans]);
    for(const m of neighbourWords(n)){ for(const v of shuffle(BYN[m].v)){ if(opts.size>=3) break; if(v[0]!==ans && v[0]!==s.v[k][0]) opts.add(v[0]); } if(opts.size>=3) break; }
    return {type:'lanjut',k,ans,opts:shuffle([...opts])};
  });
}
function buildSusun(n){
  // susun kata demi kata: tiap soal = satu ayat (ayat panjang dipotong maks 10 kata)
  const s=BYN[n], L=s.v.length;
  return Array.from({length:L},(_,i)=>{
    const w=s.v[i][0].split(/\s+/).filter(Boolean);
    return {type:'susun',i,words:w,from:0,to:w.length};
  });
}

function startGame(n,kind,node){
  n=String(n);
  const qs = kind==='susun'?buildSusun(n): kind==='lengkapi'?buildLengkapi(n): buildLanjut(n);
  if(node===undefined){ const j=PATH.findIndex(x=>x.n===n&&x.k===kind); node=j<0?undefined:j; }
  go({screen:'game',n,kind,qs,q:0,mistakes:0,step:0,locked:false,node});
}

function game(){
  const st=state, s=BYN[st.n];
  if(st.q>=st.qs.length) return result();
  const q=st.qs[st.q];
  const pct = Math.round((st.q/st.qs.length)*100);
  let body='';
  if(q.type==='lengkapi'){
    const html=q.words.map((w,j)=> j===q.j?`<span class="blank" id="blank">${w}</span>`:wspan(w,j)).join(' ');
    body=`<p class="prompt">Kata apa yang hilang?</p>
      <div class="panel question"><div class="ar" lang="ar">${html} <span class="mark">﴿${arNum(s.off+q.i+1)}﴾</span></div><div class="tr">${esc(s.v[q.i][1])}</div></div>
      <div class="opts words">${q.opts.map(o=>`<button class="opt" lang="ar" data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
  } else if(q.type==='lanjut'){
    const prev = q.k>0?`<div class="ar prev" lang="ar">${cw(s.v[q.k-1][0])} <span class="mark">﴿${arNum(s.off+q.k)}﴾</span></div>`:'';
    body=`<p class="prompt">Ayat ke-${s.off+q.k+1} sudah dibaca. Ayat ke-${s.off+q.k+2} yang mana?</p>
      <div class="panel question">${prev}<div class="ar" lang="ar">${cw(s.v[q.k][0])} <span class="mark">﴿${arNum(s.off+q.k+1)}﴾</span></div></div>
      <div class="opts lines">${q.opts.map(o=>`<button class="opt" lang="ar" data-o="${esc(o)}">${cw(o)}</button>`).join('')}</div>`;
  } else {
    const W=q.words, need=q.to-q.from, GRP=8;
    const gs=Math.floor(st.step/GRP)*GRP;
    if(!q.pool || q.poolAt!==gs){ q.poolAt=gs; q.pool=shuffle(Array.from({length:Math.min(GRP,need-gs)},(_,k)=>q.from+gs+k)); }
    const placedN=st.step;
    let line='';
    for(let k=0;k<W.length;k++){
      if(k<q.from) line+=`<span class="w ctx">${W[k]}</span>`;
      else if(k<q.from+placedN) line+=`<span class="w">${W[k]}</span>`;
      else if(k===q.from+placedN && k<q.to) line+=`<span class="wslot" aria-label="kata berikutnya"></span>`;
    }
    if(q.to>=W.length && placedN>=need) line+=`<span class="mark">﴿${arNum(s.off+q.i+1)}﴾</span>`;
    const prevA = q.i>0?`<div class="wprev" lang="ar">${cw(s.v[q.i-1][0])} <span class="mark">﴿${arNum(s.off+q.i)}﴾</span></div>`:'';
    body=`<p class="prompt">Ayat ke-${s.off+q.i+1} dari ${s.off+s.v.length}. Susun kata demi kata dari kanan ke kiri sampai ayatnya lengkap.${W.length>GRP?` <span class="smeta">(${Math.min(W.length,gs+GRP)}/${W.length} kata)</span>`:''}</p>
      ${prevA}
      <div class="wbuilt" lang="ar">${line}</div>
      <div class="wtr">${esc(s.v[q.i][1])}</div>
      ${audioBtn(s.sn,s.off+q.i+1)}
      <div class="opts wpool">${q.pool.filter(i=>!(q.placed||[]).includes(i)).map(i=>`<button class="opt" lang="ar" data-i="${i}">${W[i]}</button>`).join('')}</div>`;
  }
  $app.innerHTML = top(GAMES[st.kind].name, `${esc(s.lat)} · soal ${st.q+1} dari ${st.qs.length}`, 'surah') + `
    <main class="wrap" style="padding-top:.25rem"><div class="gtop"><div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="combo ${(st.combo||0)>=2?'on':''} ${st.comboPop?'pop':''}" id="combo" aria-live="polite">${FLAME_SVG}${st.combo||0}x</span></div>${body}<div class="feedback" id="fb" aria-live="polite"></div>${inv().hint>0?`<div class="btns"><button class="btn alt hintbtn" id="hint">${SHOP_ICON.hint} Petunjuk (${inv().hint})</button></div>`:''}</main>`;
  bindBack(st.n);
  const fb=document.getElementById('fb');
  const say=(ok)=>{ fb.className='feedback '+(ok?'good':'bad'); fb.textContent= ok?(kidName&&Math.random()<.4? pick(['Hebat','Pintar','MasyaAllah'])+', '+kidName+'!' : pick(PRAISE)):pick(TRY); };
  const hb=document.getElementById('hint');
  if(hb) hb.onclick=()=>{
    if(st.locked) return; const I=inv(); if(I.hint<=0) return;
    if(q.type==='susun'){ const want=q.words[q.from+st.step]; const btn=[...$app.querySelectorAll('.opt')].find(x=>q.words[+x.dataset.i]===want); if(btn) btn.classList.add('hinted'); }
    else { const wrong=[...$app.querySelectorAll('.opt:not([disabled])')].filter(x=>x.dataset.o!==q.ans); if(!wrong.length) return; const w=pick(wrong); w.disabled=true; w.classList.add('gone'); }
    I.hint--; save(); hb.innerHTML=SHOP_ICON.hint+' Petunjuk ('+I.hint+')'; if(I.hint<=0) hb.disabled=true;
  };
  if(q.type==='susun'){
    const W=q.words, need=q.to-q.from;
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(st.locked) return;
      const i=+b.dataset.i, target=q.from+st.step;
      if(W[i]===W[target]){ // kata yang sama persis juga dianggap benar
        q.placed=(q.placed||[]);
        if(i!==target){ const pi=q.pool.indexOf(i), ps=q.pool.indexOf(target); [q.pool[pi],q.pool[ps]]=[q.pool[ps],q.pool[pi]]; }
        q.placed.push(target); st.step++;
        comboHit();
        if(st.step>=need){ st.locked=true; game(); comboShow(); if(audioOK) playAyah(s.sn,s.off+q.i+1,true); const f=document.getElementById('fb'); f.className='feedback good'; f.textContent=pick(PRAISE); setTimeout(()=>{st.locked=false;st.q++;st.step=0;st.comboPop=false;game();},1100); }
        else { game(); comboShow(); }
      } else { sBad(); st.mistakes++; comboMiss(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); say(false); }
    });
  } else {
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(st.locked || b.disabled) return;
      if(b.dataset.o===q.ans){
        st.locked=true; comboHit(); comboShow(); b.classList.add('right'); say(true);
        const bl=document.getElementById('blank'); if(bl) bl.classList.add('filled');
        $app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        setTimeout(()=>{st.locked=false;st.q++;game();},1000);
      } else { sBad(); st.mistakes++; comboMiss(); b.classList.add('wrong'); b.disabled=true; say(false); }
    });
  }
}


// ---------- suara Syekh Abdurrahman As-Sudais (EveryAyah, per ayat) ----------
const SUDAIS='https://everyayah.com/data/Abdurrahmaan_As-Sudais_64kbps/';
const pad3=x=>String(x).padStart(3,'0');
let audioOK=null, AUD=null, audQueue=null;
function sudaisURL(sn,a){ return SUDAIS+pad3(sn)+pad3(a)+'.mp3'; }
function audioBtn(sn,a,label,until){
  return `<div class="audrow"><button class="btn alt audbtn" data-aud="${sn}:${a}${until?':'+until:''}">${SPEAK_SVG}<span>${label||'Dengarkan Syekh Sudais'}</span></button></div>`;
}
const SPEAK_SVG='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
function stopAudio(){ if(AUD){ AUD.pause(); AUD.onended=null; AUD.onerror=null; } audQueue=null; document.querySelectorAll('.audbtn.playing').forEach(b=>b.classList.remove('playing')); }
function playAyah(sn,a,quiet,until,btn){
  stopAudio();
  if(!AUD) AUD=new Audio();
  const url=sudaisURL(sn,a);
  AUD.src=url;
  if(btn) btn.classList.add('playing');
  AUD.onended=()=>{ if(until && a<until && btn && document.body.contains(btn)) playAyah(sn,a+1,true,until,btn); else if(btn) btn.classList.remove('playing'); };
  AUD.onerror=()=>{ audioOK=false; if(btn) btn.classList.remove('playing'); if(!quiet){ toast('Suara dibuka di tab baru'); window.open(url,'_blank','noopener'); } };
  const pr=AUD.play();
  if(pr&&pr.then) pr.then(()=>{audioOK=true;}).catch(e=>{ if(e&&e.name==='NotAllowedError') return; AUD.onerror&&AUD.onerror(); });
}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-aud]'); if(!b) return;
  e.preventDefault();
  if(b.classList.contains('playing')){ stopAudio(); return; }
  const [sn,a,u]=b.dataset.aud.split(':').map(Number);
  playAyah(sn,a,false,u||0,b);
});
// ---------- combo ----------
const COMBO_WORD={3:'Mantap!',5:'Hebat!',8:'Luar biasa!',10:'MasyaAllah!',15:'Super!',20:'Juara!'};
function comboHit(){
  const st=state; st.combo=(st.combo||0)+1; st.maxCombo=Math.max(st.maxCombo||0,st.combo); st.comboPop=true;
  const c=st.combo;
  if(c>=3) tone([523*Math.pow(1.06,Math.min(c,16)),784*Math.pow(1.06,Math.min(c,16))],.1,'triangle'); else sGood();
  st.comboFx = (COMBO_WORD[c] || (c>20 && c%5===0)) ? c : 0;
}
function comboMiss(){ const st=state; if((st.combo||0)>=3) { const el=document.getElementById('combo'); if(el){ el.classList.remove('on'); } } st.combo=0; st.comboPop=false; }
function comboShow(){
  const st=state, c=st.comboFx; if(!c) return; st.comboFx=0;
  const old=document.querySelector('.combofx'); if(old) old.remove();
  const d=document.createElement('div'); d.className='combofx'; d.setAttribute('aria-hidden','true');
  d.innerHTML=`<b>${c}x COMBO</b><span>${COMBO_WORD[c]||'Terus lanjut!'}</span>`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1150);
  if(c>=5){ burst(); sWin(); }
}
function result(){
  const st=state, s=BYN[st.n];
  const tol = st.kind==='susun'?Math.max(2,Math.round(st.qs.length/3)):2;
  const stars = st.mistakes===0?3: st.mistakes<=tol?2:1;
  const r=rec(st.n); const prev=r.s[st.kind]||0; if(stars>prev){ r.s[st.kind]=stars; save(); }
  if(!st.counted){ st.counted=bump({stars,games:1,perfect:stars===3?1:0}, st.n+':'+st.kind); st.cbonus=Math.floor((st.maxCombo||0)/5)*5; st.earned=stars*5+st.cbonus+st.counted.newly.length*10+(st.counted.finished?20:0); P._coins=(P._coins||0)+stars*5+st.cbonus; P._bestCombo=Math.max(P._bestCombo||0,st.maxCombo||0); save(); }
  const mres=st.counted;
  sWin(); burst();
  const msg = stars===3?'Sempurna, tanpa salah!': stars===2?`Hebat! Ada ${st.mistakes} kesalahan kecil.`:'Bagus! Main lagi supaya makin lancar.';
  const allDone = starsOf(st.n)>=9;
  $app.innerHTML = top(GAMES[st.kind].name, esc(s.lat), 'surah') + `
  <main class="wrap"><div class="panel result">
    <div class="bigstars">${[0,1,2].map(i=>`<span class="s">${STAR(i<stars)}</span>`).join('')}</div>
    <h2>${nm(pick(['MasyaAllah','Barakallahu fiik','Alhamdulillah']))}</h2>
    <p>${msg}</p>
    <div class="earn">${COIN_SVG}<b>+${st.earned} koin</b></div>
    ${(st.maxCombo||0)>=3?`<div class="newm">${FLAME_SVG} Combo terbaik: ${st.maxCombo}x${st.cbonus?` · bonus +${st.cbonus} koin`:''}</div>`:''}
    ${mres.newly.map(m=>`<div class="newm">Misi selesai: ${esc(mtext(m))}</div>`).join('')}
    ${mres.finished?`<div class="newm">Semua misi hari ini selesai! Hari beruntun: ${streak()}</div>`:''}
    ${allDone?`<p style="color:var(--good);font-weight:800">Semua bintang surah ${esc(s.lat)} sudah terkumpul!</p>`:''}
    <div class="btns"><button class="btn next" id="nextStep">Lanjut</button><button class="btn alt" id="again">Main lagi</button></div>
  </div></main>`;
  bindBack(st.n);
  document.getElementById('again').onclick=()=>startGame(st.n,st.kind);
  document.getElementById('nextStep').onclick=()=>go({screen:'home',focus:true});
}

function announce(res){ if(res.finished) { sWin(); burst(); toast('Semua misi hari ini selesai! Hari beruntun: '+streak()); } else if(res.newly.length) toast('Misi selesai: '+mtext(res.newly[0])); }
applyColor();
applyLayout();
if(CapApp){ CapApp.addListener('backButton',()=>{
  const sc=state.screen, tb=state.tab||'learn';
  if(sc==='home' && tb==='learn') CapApp.exitApp();
  else if(sc==='game' && state.n) go({screen:'surah',n:state.n});
  else go({screen:'home',tab:'learn',focus:true});
}); }
if(curJuz!==30){ const want=curJuz; juzLoading=true; ORDER=[]; PATH=[]; render(); loadJuz(want).then(ok=>{ juzLoading=false; if(ok) useJuz(want); else { useJuz(30); toast('Juz '+want+' belum bisa dimuat, kembali ke Juz 30'); } render(); }); }
else render();
})();
</script>
